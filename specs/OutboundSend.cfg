\* TLC configuration for the AgencyOS outbound send protocol (ADR-0028).
\*
\* Three attempts is enough to reach every interesting shape: a first failure, a
\* retry, and exhaustion. A larger bound multiplies states without exercising a
\* transition the model does not already reach at three.

SPECIFICATION Spec

CONSTANTS
    MaxAttempts = 3

INVARIANT
    Safety

\* The properties that would matter to a person, checked as temporal formulas
\* because each is about what may follow a state rather than about the state
\* itself.
PROPERTY
    SentIsMonotonic
    UnknownIsNeverAssumedFailed
    EventuallySettles
