\* TLC configuration for the AgencyOS AI approval-to-execution protocol
\* (M12, ADR-0031).
\*
\* Two attempts is enough. One reaches the effect; the second is the retry that
\* must not produce a second one, which is the property the bound exists to
\* exercise. A larger bound multiplies states without reaching a transition the
\* model does not already reach at two.

SPECIFICATION Spec

CONSTANTS
    MaxAttempts = 2

INVARIANT
    Safety

\* Each of these is about what may follow a state rather than about the state
\* itself, so they are checked as temporal formulas.
PROPERTY
    RevocationPreventsExecution
    CancellationKeepsCommittedEffects
    ExecutedIsTerminal
    ApprovedArgumentsAreFrozen
    DecisionIsMadeOnce
    LapsedApprovalNeverExecutes
    EveryDecisionSettles
