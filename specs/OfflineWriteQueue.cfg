\* Add statements after this line.
\* TLC configuration for the AgencyOS M3 offline write queue.
\*
\* Two commands and two attempts is enough to exhibit every fault ordering the
\* protocol must survive - concurrent submission, lost acknowledgement after a
\* commit, crash-and-replay, and attempt exhaustion - while keeping the state
\* space small enough to check exhaustively in seconds.

SPECIFICATION Spec

CONSTANTS
    Commands = {c1, c2}
    MaxAttempts = 2

INVARIANTS
    TypeOk
    AtMostOneEffect
    AcknowledgedIsCommitted
    CommittedNeverPermanentlyFailed
    StaleNeverOverwrites
    ConflictOnlyWhenStale

\* Liveness is deliberately not checked: the model permits an adversarial
\* network that loses every acknowledgement for ever. See QueueDrains.
