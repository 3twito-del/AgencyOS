\* TLC configuration for the AgencyOS device-local inference lease protocol
\* (M13, ADR-0035).
\*
\* Two returns is enough. One reaches the effect; the second is the replay that
\* must not produce a second one, which is the property the bound exists to
\* exercise. A larger bound multiplies states without reaching a transition the
\* model does not already reach at two.

SPECIFICATION Spec

CONSTANTS
    MaxReturns = 2

INVARIANT
    Safety

\* Each of these is about what may follow a state rather than about the state
\* itself, so they are checked as temporal formulas.
PROPERTY
    NoEffectWithoutCurrentPermission
    NoEffectWithoutValidLease
    MismatchedPresentationNeverTakesEffect
    ExpiredLeaseCannotAuthorize
    CancelledRunCreatesNothing
    CancellationNeverErasesEffects
    LeaseAlwaysStopsAuthorizing
