# AgencyOS continuous integration.
#
# Two jobs, split by what each can actually prove:
#
#   windows-build     builds the whole solution including the WinUI 3 client,
#                     which cannot build on a non-Windows agent
#                     (docs/12_WINDOWS_NATIVE.md), and runs everything that does
#                     not need a database.
#
#   integration-tests runs the database suite against the exact ALPHA baseline
#                     image, pinned in config/version-policy.yaml.
#
# Both call scripts/Invoke-AgencyOS.ps1, so CI and local engineering run the same
# commands (CLAUDE.md section 8). pwsh is preinstalled on both runner images.
#
# PostgreSQL is provisioned by an explicitly pinned service container rather than
# by whatever a runner image happens to ship. Linux service containers are not
# available to Windows runners, which is why the database suite runs on Ubuntu.
# Nothing about the database suite is Windows-specific: it exercises the API host
# and the schema, neither of which involves the Windows client.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Build and unit tests (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so build metadata can resolve a real commit.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # TLC runs on the JVM. Pinned to a specific major rather than whatever the
      # runner image happens to ship, so a model-checking result means the same
      # thing from one run to the next.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        shell: pwsh
        env:
          CI: 'true'
        run: pwsh -NoProfile -File scripts/Invoke-AgencyOS.ps1 build

      - name: Unit tests
        shell: pwsh
        env:
          CI: 'true'
        run: pwsh -NoProfile -File scripts/Invoke-AgencyOS.ps1 test-unit

      - name: Windows tests
        shell: pwsh
        env:
          CI: 'true'
        run: pwsh -NoProfile -File scripts/Invoke-AgencyOS.ps1 test-windows

      - name: API contract
        shell: pwsh
        env:
          CI: 'true'
        run: pwsh -NoProfile -File scripts/Invoke-AgencyOS.ps1 contract

      - name: Version metadata
        shell: pwsh
        env:
          CI: 'true'
        run: pwsh -NoProfile -File scripts/Invoke-AgencyOS.ps1 version

      # Model checks the two protocols where a wrong answer is expensive and no
      # amount of testing enumerates the interleavings: the M3 offline write queue
      # and the M10 outbound send protocol, whose failure mode is sending a client
      # the same commercial email twice (ADR-0028).
      #
      # The runner already has a JDK. TLC itself is fetched once and pinned by
      # SHA-256 by the script, which fails loudly rather than skipping when the
      # checksum does not match.
      - name: Formal (TLC)
        shell: pwsh
        env:
          CI: 'true'
        run: pwsh -NoProfile -File scripts/Invoke-AgencyOS.ps1 formal

      - name: Upload API contract
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: artifacts/openapi/*.json
          if-no-files-found: error

  integration-tests:
    name: Integration tests (PostgreSQL 18.6)
    runs-on: ubuntu-latest

    services:
      postgres:
        # The ALPHA real-data baseline. Pinned exactly; never "latest".
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The suite creates and drops its own databases on this server, so it needs
      # a connection string rather than a prepared schema.
      - name: Integration tests
        shell: pwsh
        env:
          CI: 'true'
          AGENCYOS_TEST_POSTGRES: 'Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres'
        run: pwsh -NoProfile -File scripts/Invoke-AgencyOS.ps1 test-integration
