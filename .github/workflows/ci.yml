# AgencyOS continuous integration.
#
# Runs on windows-latest because AgencyOS.Windows is a WinUI 3 client and cannot
# build on a non-Windows agent (docs/12_WINDOWS_NATIVE.md). All steps go through
# scripts/Invoke-AgencyOS.ps1 so CI and local engineering share one entrypoint
# (CLAUDE.md section 8).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so build metadata can resolve a real commit.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Integration tests run against a real PostgreSQL server and fail rather
      # than skip without one (docs/11_TESTING_AND_FORMAL_METHODS.md). Linux
      # service containers are not available to a Windows runner, so this uses the
      # PostgreSQL that ships stopped on the GitHub Windows image.
      #
      # NOTE: unverified locally - this repository has no remote yet, so this step
      # has never executed. Confirm the service name and credentials against
      # actions/runner-images on the first CI run.
      - name: Start PostgreSQL
        id: postgres
        shell: pwsh
        run: |
          $service = Get-Service -Name 'postgresql*' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $service) {
              throw 'No PostgreSQL service found on this runner. Integration tests require one.'
          }

          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name
          Write-Host "Started $($service.Name)."

          "AGENCYOS_TEST_POSTGRES=Host=localhost;Port=5432;Username=postgres;Password=root;Database=postgres" |
              Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify
        shell: pwsh
        env:
          CI: 'true'
        run: pwsh -NoProfile -File scripts/Invoke-AgencyOS.ps1 ci
