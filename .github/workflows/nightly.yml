# AgencyOS NIGHTLY ring build.
#
# Governing documents: docs/05_RELEASE_ENGINEERING.md (ring definitions) and
# config/release-channels.yaml (NIGHTLY permits non-canonical data only).
#
# The channel is stamped into the artifact's build metadata, so a nightly build
# can never present itself to the release authority as an ALPHA or STABLE client.
#
# The database suite gates the artifact: the Windows job does not start until the
# integration job has passed, so no artifact is published from a commit whose
# schema or API behavior is broken.

name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    name: Integration tests (PostgreSQL 18.6)
    runs-on: ubuntu-latest

    services:
      postgres:
        # The ALPHA real-data baseline. Pinned exactly; never "latest".
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned 2026-09-09
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4, pinned 2026-09-09
        with:
          global-json-file: global.json

      - name: Integration tests
        shell: pwsh
        env:
          CI: 'true'
          AGENCYOS_TEST_POSTGRES: 'Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres'
        run: pwsh -NoProfile -File scripts/Invoke-AgencyOS.ps1 test-integration

  artifact:
    name: Nightly artifact (Windows)
    runs-on: windows-latest
    needs: integration-tests

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned 2026-09-09
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4, pinned 2026-09-09
        with:
          global-json-file: global.json

      - name: Compute build id
        id: buildid
        shell: pwsh
        run: |
          $buildId = '{0}.{1}' -f (Get-Date -Format 'yyyyMMdd'), $env:GITHUB_RUN_NUMBER
          "value=$buildId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Produce nightly artifact
        shell: pwsh
        env:
          CI: 'true'
        run: >
          pwsh -NoProfile -File scripts/Invoke-AgencyOS.ps1 nightly
          -Channel nightly
          -BuildId ${{ steps.buildid.outputs.value }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, pinned 2026-09-09
        with:
          name: agencyos-nightly-${{ steps.buildid.outputs.value }}
          path: artifacts/nightly/**
          if-no-files-found: error
          retention-days: 14
