snapshot_date: 2026-09-06

policy:
  philosophy: "frontier-tracking with promotion gates"
  forge_tracks_upstream: true
  canonical_data_allowed_from: alpha

rings:
  forge:
    data: synthetic_only
    update: always_latest
  lab:
    data: isolated_only
    update: always_latest
  nightly:
    data: noncanonical
    update: always_latest
  alpha:
    data: real_private_allowed
    update: aggressive
  beta:
    data: production_like
    update: staged
  rc:
    data: production_like
    update: controlled
  stable:
    data: canonical
    update: staged_and_signed

toolchains:
  dotnet:
    forge: "latest official daily/main build"
    lab_public: "11.0.100-preview.7"
    lab_full_build: "11.0.100-preview.7.26381.103"
    alpha_sdk: "10.0.400"
    alpha_runtime: "10.0.11"
    languages:
      lab_csharp: "15"
      alpha_csharp: "14"
      fsharp: "10"
  windows_app_sdk:
    lab: "2.4.1-experimental"
    alpha: "2.4.0"
  windows_sdk:
    # Frontier target for FORGE/LAB, enabled when provisioned on a build machine.
    frontier: "10.0.28000.2705"
    # SDK installed and validated for the ALPHA real-data ring. ALPHA is never
    # retargeted to an SDK that is not installed and validated.
    alpha_validated: "10.0.26100.0"
  postgresql:
    forge: "development snapshot / git HEAD"
    lab: "19 Beta 3"
    alpha: "18.6"
  pgvector:
    introduced_version: "0.8.6"
  python:
    forge: "CPython main"
    lab: "3.15.0rc2"
    alpha: "latest supported stable; pin during bootstrap"
  rust:
    forge: "nightly"
    alpha: "latest stable; pin during bootstrap"
  typescript:
    current: "6.0"
  node:
    lab_current: "26.8.1"
    production_tooling: "supported LTS; pin during bootstrap"
  visual_studio:
    edge: "Visual Studio 2026 Insiders 18.10 branch"
    stable: "Visual Studio 2026 18.9.2"
  temporal_dotnet:
    snapshot: "1.18.0"
    introduce_only_when_required: true
    # M10 was the first milestone with background work and did not introduce it.
    # See docs/adr/ADR-0029-background-work-leasing-and-not-temporal.md.
  tla_tools:
    # TLC, used by `scripts/Invoke-AgencyOS.ps1 formal` and by CI. Fetched once
    # and pinned by SHA-256; a mismatch fails loudly rather than skipping, because
    # a formal check that quietly skips itself is worse than none.
    version: "1.8.0"
    sha256: "b658b4e504fdf0b721caf7066320f6b6fe5805f4dd2f717d0e47baba4097205e"

promotion_gates:
  - compile
  - unit_tests
  - integration_tests
  - migration_tests
  - windows_smoke_tests
  - data_integrity_checks
  - security_checks
  - performance_regression_check
  - rollback_or_recovery_verification
